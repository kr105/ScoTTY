# Cross file adicional que permite ejecutar los binarios compilados, y con
# ellos la suite de tests, sin salir de Linux.
#
#   meson setup build \
#       --cross-file cross/x86_64-w64-mingw32.ini \
#       --cross-file cross/wine.ini
#   meson test -C build
#
# Va aparte del cross file principal a propósito: compilar no debe exigir wine.
# Sin este fichero los tests se compilan igualmente, pero no se ejecutan.

[binaries]
exe_wrapper = 'wine'
