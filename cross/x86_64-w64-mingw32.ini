# Cross-compilación de Linux/WSL a Windows x86_64.
#
#   meson setup build --cross-file cross/x86_64-w64-mingw32.ini
#   ninja -C build
#
# Requiere: gcc-mingw-w64-x86-64, binutils-mingw-w64-x86-64

[binaries]
c       = 'x86_64-w64-mingw32-gcc'
cpp     = 'x86_64-w64-mingw32-g++'
ar      = 'x86_64-w64-mingw32-ar'
strip   = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
# Cero timestamp en la cabecera PE. Es el default en binutils >= 2.36 pero se
# pasa explícito para no depender de la versión del toolchain.
c_link_args = ['-Wl,--no-insert-timestamp']
