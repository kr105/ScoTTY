name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Instantánea inmutable del archivo de Debian. Es lo que hace que el build
  # siga siendo reproducible dentro de dos años y no solo hoy: apuntar a
  # "bookworm" a secas traería el toolchain que hubiera ese día.
  #
  # Se accede por http, no https, a propósito: bookworm-slim no trae
  # ca-certificates, así que https aquí falla antes de poder instalarlo. La
  # integridad la da la firma GPG que apt verifica, no el transporte.
  #
  # Para actualizar el toolchain, se cambia esta fecha en un commit propio y se
  # comprueba que los hashes publicados cambian de forma esperada.
  DEBIAN_SNAPSHOT: '20260501T000000Z'
  # debian:bookworm-slim, fijada por digest y no por etiqueta.
  DEBIAN_IMAGE: 'debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241'

jobs:
  build:
    name: compilar y probar
    runs-on: ubuntu-latest
    container:
      image: 'debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241'
    env:
      WINEDEBUG: '-all'
      # GitHub monta HOME=/github/home desde el host, con un uid distinto al del
      # contenedor, y wine se niega a crear su prefijo ahí:
      #   wine: '/github/home' is not owned by you, refusing to create a
      #   configuration directory there
      # /tmp sí es local al contenedor y pertenece a root, que es quien ejecuta.
      WINEPREFIX: /tmp/wineprefix
    steps:
      - name: fijar apt a la instantánea de Debian
        run: |
          set -eux
          # Fuente única y deliberada: solo la instantánea. Añadir
          # deb.debian.org como respaldo parecería robustez, pero apt elegiría
          # la versión más alta de las dos y acabaría cogiendo el toolchain del
          # archivo vivo, rompiendo en silencio la reproducibilidad. Si la
          # instantánea no responde, es mejor que el build falle a que compile
          # con un toolchain distinto del declarado.
          printf 'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/%s bookworm main\n' "$DEBIAN_SNAPSHOT" > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=60 update

      - name: instalar toolchain
        run: |
          set -eux
          apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=60 install -y --no-install-recommends \
            ca-certificates curl git \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-tools \
            meson ninja-build python3 wine
          x86_64-w64-mingw32-gcc --version

      - uses: actions/checkout@v4

      - name: marcar el checkout como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # meson setup ejecuta un binario de prueba a través de wine para comprobar
      # que el cross-compilador funciona. Con el prefijo de wine sin crear, esa
      # comprobación puede fallar y el error que sale es "los ejecutables del
      # compilador no son ejecutables", que despista. Se crea aquí, aparte, para
      # que un problema de wine se vea como un problema de wine.
      - name: inicializar el prefijo de wine
        run: |
          mkdir -p "$WINEPREFIX"
          wine wineboot --init
          wineserver -w

      - name: configurar
        run: |
          meson setup build \
            --cross-file cross/x86_64-w64-mingw32.ini \
            --cross-file cross/wine.ini

      - name: compilar
        run: ninja -C build

      - name: probar
        run: meson test -C build --print-errorlogs

      - name: comprobar que el build no ha tocado el árbol de fuentes
        # El build anterior hacía `sed -i` sobre window.c y version_major.txt,
        # así que compilar dejaba el repositorio modificado. Esto lo impide.
        run: git diff --exit-code

      - name: recoger artefactos, hashes y entradas del build
        run: |
          set -eux
          mkdir -p dist
          cp build/0.76b_My_PuTTY/windows/*.exe dist/
          # Sin estas dos entradas nadie puede reproducir los binarios: el sello
          # de tiempo y el commit se compilan dentro de ellos. Se publican junto
          # a los hashes para que un tercero pueda repetir el build exacto.
          {
            printf 'SOURCE_DATE_EPOCH=%s\n' "$(tools/build-stamp.sh epoch)"
            printf 'SOURCE_COMMIT=%s\n'     "$(tools/build-stamp.sh commit)"
            printf 'DEBIAN_SNAPSHOT=%s\n'   "$DEBIAN_SNAPSHOT"
            printf 'DEBIAN_IMAGE=%s\n'      "$DEBIAN_IMAGE"
          } > dist/BUILD-INPUTS
          cd dist
          sha256sum *.exe | tee SHA256SUMS
          cat BUILD-INPUTS

      - uses: actions/upload-artifact@v4
        with:
          name: scotty-x86_64
          path: dist/
          if-no-files-found: error

  reproducible:
    name: verificar reproducibilidad
    runs-on: ubuntu-latest
    container:
      image: 'debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241'
    steps:
      - name: fijar apt a la instantánea de Debian
        run: |
          set -eux
          # Fuente única y deliberada: solo la instantánea. Añadir
          # deb.debian.org como respaldo parecería robustez, pero apt elegiría
          # la versión más alta de las dos y acabaría cogiendo el toolchain del
          # archivo vivo, rompiendo en silencio la reproducibilidad. Si la
          # instantánea no responde, es mejor que el build falle a que compile
          # con un toolchain distinto del declarado.
          printf 'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/%s bookworm main\n' "$DEBIAN_SNAPSHOT" > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=60 update

      - name: instalar toolchain
        run: |
          set -eux
          apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=60 install -y --no-install-recommends \
            ca-certificates curl git tzdata \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-tools \
            meson ninja-build python3

      - uses: actions/checkout@v4

      - name: marcar el checkout como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Compila dos veces en rutas, zonas horarias, umasks y entornos distintos
      # y compara los sha256. Falla si algún binario difiere. Es lo que
      # convierte "reproducible" en una propiedad comprobada y no una promesa.
      - name: compilar dos veces y comparar
        run: tools/verify-reproducible.sh

  attest:
    name: procedencia
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scotty-x86_64
          path: dist

      # Firma una declaración de procedencia SLSA ligada a este workflow y a
      # este commit. Junto con el job de reproducibilidad, permite a un tercero
      # recompilar y comprobar que obtiene exactamente estos binarios.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.exe'
